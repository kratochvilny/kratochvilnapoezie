<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratochvilná Poezie</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <audio id="pozadi-audio" src="hudba01.mp3" loop></audio>

    <!-- OVLÁDACÍ PANEL -->
    <div class="ovladani-panel">
        <button id="btn-posun" class="sbs-ikona-btn" onclick="toggleAutoPosun()" title="Kino režim">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="btn-fullscreen" class="sbs-ikona-btn" onclick="toggleFullscreen()" title="Celá obrazovka">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
        </button>
        <button id="btn-zvuk" class="sbs-ikona-btn" title="Zapnout/Vypnout zvuk">
            <svg id="svg-zvuk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path></svg>
        </button>
    </div>

    <div class="sbs-background"></div>

    <div class="story-container">

        <!-- 1. ÚVODNÍ OBRAZOVKA -->
        <section class="slide slide-intro">
            <h1 class="nadpis-hlavni">Kratochvilná Poezie</h1>
            <div class="autor">Kratochvilný Jan</div>
            <p id="sbs-indicator" class="scroll-indicator">Vstupte do světa kratochvilné poezie</p>
        </section>

        <!-- 2. OBRAZOVKA -->
        <section class="slide slide-poem">
            <!-- Úvodní verš v kurzívě -->
            <p class="vers reveal" style="font-size: 1.5rem; font-style: italic; margin-bottom: 20px; color: #4a5d4e;">
                ... a že si básník za svým slovem stál, je ...
            </p>
            
            <!-- Hlavní ústřední verš -->
            <p class="vers reveal">„Svojí mysli, sobě král.“</p>

            <!-- 🔧 PŘESNÉ ZNĚNÍ MALÝMI PÍSMENY: Čti dále se zhasínacím ID -->
            <div id="sbs-cti-dale-text" class="sbs-cti-dale">čti dále ↓</div>
        </section>

    </div>

    <script>
        var audio = document.getElementById('pozadi-audio');
        var btnZvuk = document.getElementById('btn-zvuk');
        var svgZvuk = document.getElementById('svg-zvuk');
        var autoPosunInterval = null;
        var jeZtlumeno = false;
        
        // Pomocné stopky pro detekci absolutního zastavení stránky
        var scrollTimeout = null;

        function aktualizovatWeb() {
            var odscrollovano = window.scrollY || window.pageYOffset;
            var vyskaOkna = window.innerHeight;
            
            var indicator = document.getElementById('sbs-indicator');
            var ctiDale = document.getElementById('sbs-cti-dale-text');

            // 1. Jakmile se stránka pohne, spodní text první strany zmizí
            if (indicator && odscrollovano > 10) {
                indicator.classList.add('skryt');
            }

            // 2. Jakmile se stránka HÝBE, nápis „čti dále ↓“ okamžitě zhasne (ochrana před blbým cestováním)
            if (ctiDale) {
                ctiDale.classList.remove('zobrazit');
            }

            // 3. Rozsvícení samotných veršů básně za jízdy
            var prvkyVerse = document.querySelectorAll('.reveal');
            if (odscrollovano > (vyskaOkna * 0.3)) {
                prvkyVerse.forEach(function(prvek) {
                    prvek.classList.add('active');
                });
            }

            // 🔧 MECHANISMUS 3 VTEŘIN PO ZASTAVENÍ:
            // Smazat předchozí odpočet, protože se stránka stále hýbe
            clearTimeout(scrollTimeout);

            // Nastavit nový odpočet: spustí se až 3 vteřiny (3000 ms) po úplném zastavení skrolu
            scrollTimeout = setTimeout(function() {
                // Rozsvítit „čti dále ↓“ pouze tehdy, pokud je uživatel opravdu dole u básničky
                if (ctiDale && odscrollovano > (vyskaOkna * 0.5) && autoPosunInterval === null) {
                    ctiDale.classList.add('zobrazit');
                }
            }, 3000);
        }

        window.addEventListener('scroll', aktualizovatWeb);
        window.addEventListener('touchmove', aktualizovatWeb);
        window.addEventListener('load', aktualizovatWeb);

        function spustitTichouHudbu() {
            audio.volume = 0.1;
            audio.play().then(function() {
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            }).catch(function(e) { console.log(e); });
        }

        btnZvuk.addEventListener('click', function(e) {
            e.stopPropagation(); 
            if (audio.paused) {
                jeZtlumeno = false;
                spustitTichouHudbu();
            } else {
                jeZtlumeno = true;
                audio.pause();
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path>';
            }
        });

        function toggleFullscreen() {
            var btn = document.getElementById('btn-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"></path></svg>';
                });
            } else {
                document.exitFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>';
                });
            }
        }

        function toggleAutoPosun() {
            var btn = document.getElementById('btn-posun');
            var indicator = document.getElementById('sbs-indicator');
            var ctiDale = document.getElementById('sbs-cti-dale-text');
            var prvkyVerse = document.querySelectorAll('.reveal');
            
            if (autoPosunInterval === null) {
                if (indicator) { indicator.classList.add('skryt'); }
                if (ctiDale) { ctiDale.classList.remove('zobrazit'); }

                prvkyVerse.forEach(function(prvek) {
                    prvek.classList.add('active');
                });

                autoPosunInterval = setInterval(function() {
                    window.scrollBy(0, 1);
                    
                    // 🔧 KINO STOP: Jakmile automatický posun dojede přesně na konec stránek a zastaví se
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoPosunInterval);
                        autoPosunInterval = null;
                        btn.classList.remove('aktivni');
                        
                        // Automatický posun skončil, odpočítáme 3 sekundy klidu a rozsvítíme kurzívu
                        setTimeout(function() {
                            if (ctiDale) { ctiDale.classList.add('zobrazit'); }
                        }, 3000);
                    }
                }, 35);
                btn.classList.add('aktivni');
                if (audio.paused && !jeZtlumeno) { spustitTichouHudbu(); }
            } else {
                clearInterval(autoPosunInterval);
                autoPosunInterval = null;
                btn.classList.remove('aktivni');
                // Pokud uživatel vypne kino režim ručně tlačítkem, hned spustíme hlídače klidu
                aktualizovatWeb();
            }
        }
    </script>

</body>
</html>
