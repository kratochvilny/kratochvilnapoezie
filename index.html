<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratochvilná Poezie</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        /* Skryjeme zdrojový nadpis přímo v textu básně, pokud ho chcete vidět jen v liště */
        .nazev-sekce-zdroj {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="pozadi-audio" src="hudba01.mp3" loop></audio>

    <!-- OVLÁDACÍ PANEL -->
    <div class="ovladani-panel">
        <button id="btn-posun" class="sbs-ikona-btn" onclick="toggleAutoPosun()" title="Kino režim">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="btn-fullscreen" class="sbs-ikona-btn" onclick="toggleFullscreen()" title="Celá obrazovka">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
        </button>
        <button id="btn-zvuk" class="sbs-ikona-btn" title="Zapnout/Vypnout zvuk">
            <svg id="svg-zvuk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path></svg>
        </button>
    </div>

    <!-- 🎛️ SVISLÁ LIŠTA (Názvy kapitol se vyplní zcela automaticky ze souborů) -->
    <nav class="sbs-bocni-menu">
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-uvod')">
            <span class="sbs-cislo">0</span>
            <span class="sbs-nazev-kapitoly">Úvod</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-kapitola01')">
            <span class="sbs-cislo">1</span>
            <span id="label-sekce-kapitola01" class="sbs-nazev-kapitoly">Načítání...</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-kapitola02')">
            <span class="sbs-cislo">2</span>
            <span id="label-sekce-kapitola02" class="sbs-nazev-kapitoly">Načítání...</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-kapitola03')">
            <span class="sbs-cislo">3</span>
            <span id="label-sekce-kapitola03" class="sbs-nazev-kapitoly">...</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-kapitola04')">
            <span class="sbs-cislo">4</span>
            <span id="label-sekce-kapitola04" class="sbs-nazev-kapitoly">...</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-kapitola05')">
            <span class="sbs-cislo">5</span>
            <span id="label-sekce-kapitola05" class="sbs-nazev-kapitoly">...</span>
        </div>
    </nav>

    <div class="sbs-background"></div>

    <div class="story-container">
        <section id="sekce-uvod" class="slide slide-intro">
            <h1 class="nadpis-hlavni">Kratochvilná Poezie</h1>
            <div class="autor">Kratochvilný Jan</div>
            <p id="sbs-indicator" class="scroll-indicator">Vstupte do světa kratochvilné poezie</p>
        </section>

        <!-- KONTEJNER PRO EXTERNÍ KAPITOLY -->
        <div id="externi-kapitoly"></div>
    </div>

    <script>
        var audio = document.getElementById('pozadi-audio');
        var btnZvuk = document.getElementById('btn-zvuk');
        var svgZvuk = document.getElementById('svg-zvuk');
        var autoPosunInterval = null;
        var jeZtlumeno = false;
        var scrollTimeout = null;

        // Seznam vašich externích HTML souborů
        var seznamKapitol = ['kapitola01.html', 'kapitola02.html']; 
        var kontejner = document.getElementById('externi-kapitoly');

        Promise.all(seznamKapitol.map(url => fetch(url).then(res => res.text())))
            .then(htmlObsahy => {
                kontejner.innerHTML = htmlObsahy.join('');
                
                // 🧠 AUTOMATICKÉ VYTAŽENÍ NÁZVŮ: Projedeme stažené kapitoly a přečteme jejich <h2>
                seznamKapitol.forEach(function(url) {
                    var idKapitoly = url.replace('.html', ''); // Vytvoří např. "kapitola01"
                    var stazenaSekce = document.getElementById('sekce-' + idKapitoly);
                    
                    if (stazenaSekce) {
                        var nalezenyNadpis = stazenaSekce.querySelector('.nazev-sekce-zdroj');
                        var labelVListe = document.getElementById('label-sekce-' + idKapitoly);
                        
                        // Pokud v souboru najdeme nadpis, propíšeme ho automaticky do boční lišty
                        if (nalezenyNadpis && labelVListe) {
                            labelVListe.innerText = nalezenyNadpis.innerText;
                        }
                    }
                });

                window.addEventListener('scroll', aktualizovatWeb);
                window.addEventListener('touchmove', aktualizovatWeb);
                aktualizovatWeb();
            }).catch(err => console.error("Chyba při stahování: ", err));

        function skocNaSekci(idSekce) {
            var cilovaSekce = document.getElementById(idSekce);
            if (cilovaSekce) {
                cilovaSekce.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function aktualizovatWeb() {
            var odscrollovano = window.scrollY || window.pageYOffset;
            var vyskaOkna = window.innerHeight;
            
            var indicator = document.getElementById('sbs-indicator');
            var ctiDale = document.getElementById('sbs-cti-dale-text');

            if (indicator && odscrollovano > 10) { indicator.classList.add('skryt'); }
            if (ctiDale) { ctiDale.classList.remove('zobrazit'); }

            var prvkyVerse = document.querySelectorAll('.reveal');
            prvkyVerse.forEach(function(prvek) {
                var pozice = prvek.getBoundingClientRect().top;
                if (pozice < vyskaOkna - 100) {
                    prvek.classList.add('active');
                }
            });

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
                if (ctiDale && odscrollovano > (vyskaOkna * 0.5) && autoPosunInterval === null) {
                    ctiDale.classList.add('zobrazit');
                }
            }, 3000);
        }

        function spustitTichouHudbu() {
            audio.volume = 0.1;
            audio.play().then(function() {
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            }).catch(function(e) { console.log(e); });
        }

        btnZvuk.addEventListener('click', function(e) {
            e.stopPropagation(); 
            if (audio.paused) {
                jeZtlumeno = false;
                spustitTichouHudbu();
            } else {
                jeZtlumeno = true;
                audio.pause();
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path>';
            }
        });

        function toggleFullscreen() {
            var btn = document.getElementById('btn-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"></path></svg>';
                });
            } else {
                document.exitFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>';
                });
            }
        }

        function toggleAutoPosun() {
            var btn = document.getElementById('btn-posun');
            var indicator = document.getElementById('sbs-indicator');
            var ctiDale = document.getElementById('sbs-cti-dale-text');
            var prvkyVerse = document.querySelectorAll('.reveal');
            
            if (autoPosunInterval === null) {
                if (indicator) { indicator.classList.add('skryt'); }
                if (ctiDale) { ctiDale.classList.remove('zobrazit'); }

                prvkyVerse.forEach(function(prvek) { prvek.classList.add('active'); });

                autoPosunInterval = setInterval(function() {
                    window.scrollBy(0, 1);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoPosunInterval);
                        autoPosunInterval = null;
                        btn.classList.remove('aktivni');
                        setTimeout(function() { if (ctiDale) { ctiDale.classList.add('zobrazit'); } }, 3000);
                    }
                }, 35);
                btn.classList.add('aktivni');
                if (audio.paused && !jeZtlumeno) { spustitTichouHudbu(); }
            } else {
                clearInterval(autoPosunInterval);
                autoPosunInterval = null;
                btn.classList.remove('aktivni');
                aktualizovatWeb();
            }
        }
    </script>
</body>
</html>
