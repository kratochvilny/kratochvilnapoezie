<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratochvilná Poezie</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🔧 NEPRŮSTŘELNÝ FIX: Spolehlivé a hladké odhalení textu */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <audio id="pozadi-audio" src="hudba01.mp3" loop></audio>

    <!-- OVLÁDACÍ PANEL -->
    <div class="ovladani-panel">
        <button id="btn-posun" class="sbs-ikona-btn" onclick="toggleAutoPosun()" title="Kino režim">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="btn-fullscreen" class="sbs-ikona-btn" onclick="toggleFullscreen()" title="Celá obrazovka">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
        </button>
        <button id="btn-zvuk" class="sbs-ikona-btn" title="Zapnout/Vypnout zvuk">
            <svg id="svg-zvuk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path></svg>
        </button>
    </div>

    <div class="sbs-background"></div>

    <div class="story-container">

        <!-- 1. OBRAZOVKA -->
        <section class="slide slide-intro">
            <h1 class="nadpis-hlavni">Kratochvilná Poezie</h1>
            <div class="autor">Kratochvilný Jan</div>
            <div class="scroll-indicator">Skrolujte dolů ↓</div>
        </section>

        <!-- 2. OBRAZOVKA -->
        <section class="slide slide-poem">
            <p class="vers reveal">„Svojí mysli, sobě král.“</p>
        </section>

    </div>

    <script>
        var audio = document.getElementById('pozadi-audio');
        var btnZvuk = document.getElementById('btn-zvuk');
        var svgZvuk = document.getElementById('svg-zvuk');
        var autoPosunInterval = null;
        var jeZtlumeno = false;

        // 🧠 ZBRUSU NOVÝ MECHANISMUS SLEDOVÁNÍ POHYBU STRÁNKY
        function aktualizovatWeb() {
            var odscrollovano = window.scrollY || window.pageYOffset;
            var vyskaOkna = window.innerHeight;
            var element = document.querySelector('.reveal');

            // 1. Spolehlivé zobrazení druhého verše, jakmile uživatel odscroluje aspoň o kousek z úvodní strany
            if (element && odscrollovano > (vyskaOkna * 0.3)) {
                element.classList.add('active');
            }

            // 2. 🎵 AKTIVACE HUDBY POHYBEM: Spustí se okamžitě při sebemenším skrolu
            if (audio.paused && !jeZtlumeno && odscrollovano > 2) {
                spustitTichouHudbu();
            }
        }

        // Pomocná funkce pro bezpečné zapnutí audia na 10% hlasitost
        function spustitTichouHudbu() {
            audio.volume = 0.1;
            audio.play().then(function() {
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            }).catch(function(e) { 
                console.log("Čeká se na přímější kliknutí uživatele kvůli politice prohlížeče."); 
            });
        }

        // Hlídání událostí na celé stránce
        window.addEventListener('scroll', aktualizovatWeb);
        window.addEventListener('touchmove', aktualizovatWeb); // Podpora pro mobily a tablety
        window.addEventListener('click', function() {
            // Hudba naskočí i při běžném kliknutí kamkoliv do prostoru
            if (audio.paused && !jeZtlumeno) { spustitTichouHudbu(); }
        });

        // Ruční zapínání/vypínání zvuku ikonou v panelu
        btnZvuk.addEventListener('click', function(e) {
            e.stopPropagation(); 
            if (audio.paused) {
                jeZtlumeno = false;
                spustitTichouHudbu();
            } else {
                jeZtlumeno = true;
                audio.pause();
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path>';
            }
        });

        // FULLSCREEN REŽIM
        function toggleFullscreen() {
            var btn = document.getElementById('btn-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"></path></svg>';
                });
            } else {
                document.exitFullscreen().then(function() {
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>';
                });
            }
        }

        // KINO REŽIM (AUTOMATICKÝ POSUN)
        function toggleAutoPosun() {
            var btn = document.getElementById('btn-posun');
            
            if (autoPosunInterval === null) {
                autoPosunInterval = setInterval(function() {
                    window.scrollBy(0, 1);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoPosunInterval);
                        autoPosunInterval = null;
                        btn.classList.remove('aktivni');
                    }
                }, 35);
                btn.classList.add('aktivni');
                // Pokud uživatel zapne kino režim, rovnou mu aktivujeme i zvuk
                if (audio.paused && !jeZtlumeno) { spustitTichouHudbu(); }
            } else {
                clearInterval(autoPosunInterval);
                autoPosunInterval = null;
                btn.classList.remove('aktivni');
            }
        }
    </script>

</body>
</html>
