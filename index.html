<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratochvilná Poezie</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.8s ease-out, transform 1.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <audio id="pozadi-audio" src="hudba01.mp3" loop></audio>

    <!-- OVLÁDACÍ PANEL -->
    <div class="ovladani-panel">
        <button id="btn-posun" class="sbs-ikona-btn" onclick="toggleAutoPosun()" title="Kino režim">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="btn-fullscreen" class="sbs-ikona-btn" onclick="toggleFullscreen()" title="Celá obrazovka">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
        </button>
        <button id="btn-zvuk" class="sbs-ikona-btn" title="Zapnout/Vypnout zvuk">
            <svg id="svg-zvuk" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path></svg>
        </button>
    </div>

    <!-- SVISLÁ LIŠTA (Pravá strana) -->
    <nav class="sbs-bocni-menu">
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('sekce-uvod')">
            <span class="sbs-cislo">0</span>
            <span class="sbs-nazev-kapitoly">Úvod</span>
        </div>
        <div class="sbs-bocni-polozka" onclick="skocNaSekci('kapitola1-kotva')">
            <span class="sbs-cislo">1</span>
            <span class="sbs-nazev-kapitoly">Kratochvilná předmluva</span>
        </div>
    </nav>

    <!-- FILMOVÁ PLÁTNA NA POZADÍ -->
    <div id="bg-uvod" class="sbs-background bg-kytice"></div>
    <div id="bg-kapitola1" class="sbs-background bg-basnik"></div>

    <div class="story-container">
        
        <!-- OBRAZOVKA 0: ÚVODNÍ STRANA -->
        <section id="sekce-uvod" class="slide slide-intro">
            <h1 class="nadpis-hlavni">Kratochvilná Poezie</h1>
            <div class="autor">Kratochvilný Jan</div>
            
            <div class="motto-blok">
                <p style="font-size: 1.4rem; font-style: italic; color: #4a5d4e; margin: 0 0 10px 0;">
                    „Jak jsem myslil, tak jsem psal.“
                </p>
                <p style="font-size: 2rem; font-weight: 300; color: #000; margin: 0;">
                    „Svojí mysli, sobě král.“
                </p>
            </div>

            <p id="sbs-indicator" class="scroll-indicator">Vstupte do světa kratochvilné poezie</p>
        </section>

        <!-- 🔧 NATÍVNÍ IMPORT: Tento tag bezpečně vtáhne soubor kapitoly na 100 % bez chyb JavaScriptu -->
        <div id="kapitola1-kotva" style="width:100%;">
            <object data="kapitola01.html" type="text/html" style="width:100%; height:300vh; display:block; overflow:hidden;" onload="inicializovatKapitolu(this)"></object>
        </div>

    </div>

    <script>
        var audio = document.getElementById('pozadi-audio');
        var btnZvuk = document.getElementById('btn-zvuk');
        var svgZvuk = document.getElementById('svg-zvuk');
        var autoPosunInterval = null;
        var jeZtlumeno = false;
        var scrollTimeout = null;
        var vnitrniDokumentKapitoly = null;

        // Skript si po bezpečném načtení osahá vnitřek souboru kapitoly
        function inicializovatKapitolu(objekt) {
            vnitrniDokumentKapitoly = objekt.contentDocument || objekt.contentWindow.document;
            window.addEventListener('scroll', aktualizovatWeb);
            window.addEventListener('touchmove', aktualizovatWeb);
            aktualizovatWeb();
        }

        function skocNaSekci(idSekce) {
            var cilovaSekce = document.getElementById(idSekce);
            if (cilovaSekce) {
                cilovaSekce.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function aktualizovatWeb() {
            var odscrollovano = window.scrollY || window.pageYOffset;
            var vyskaOkna = window.innerHeight;
            
            var indicator = document.getElementById('sbs-indicator');
            var bgUvod = document.getElementById('bg-uvod');
            var bgKapitola1 = document.getElementById('bg-kapitola1');

            if (indicator && odscrollovano > 10) { indicator.classList.add('skryt'); }

            if (odscrollovano > (vyskaOkna * 0.5)) {
                if(bgUvod) bgUvod.classList.add('vypnout-bg');
                if(bgKapitola1) bgKapitola1.classList.add('zapnout-bg');
            } else {
                if(bgUvod) bgUvod.classList.remove('vypnout-bg');
                if(bgKapitola1) bgKapitola1.classList.remove('zapnout-bg');
            }

            // 🧠 ČTENÍ PARAMETRŮ Z EXTERNÍHO SOUBORU
            if (vnitrniDokumentKapitoly) {
                var sceny = vnitrniDokumentKapitoly.querySelectorAll('.sbs-scena-detekce');
                var ctiDale = vnitrniDokumentKapitoly.getElementById('sbs-cti-dale-text');
                
                if (ctiDale) { ctiDale.classList.remove('zobrazit'); }

                sceny.forEach(function(scena) {
                    var hranice = scena.getBoundingClientRect();
                    
                    // Rozsvěcování textů uvnitř kapitoly
                    var prvkyUvnitr = scena.querySelectorAll('.reveal');
                    if (hranice.top < vyskaOkna - 80) {
                        prvkyUvnitr.forEach(p => p.classList.add('active'));
                    }

                    // Detekce barvy zapsané v souboru kapitoly
                    if (hranice.top < (vyskaOkna * 0.5) && hranice.bottom > (vyskaOkna * 0.5)) {
                        var barvaKodu = scena.getAttribute('data-barva');
                        bgKapitola1.classList.remove('tón-olivova', 'tón-modra', 'tón-sepia');
                        bgKapitola1.classList.add('tón-' + barvaKodu);
                    }
                });

                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(function() {
                    if (ctiDale && odscrollovano > (vyskaOkna * 1.5) && autoPosunInterval === null) {
                        ctiDale.classList.add('zobrazit');
                    }
                }, 3000);
            }
        }

        window.addEventListener('load', aktualizovatWeb);

        function spustitTichouHudbu() {
            audio.volume = 0.1;
            audio.play().then(function() {
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            }).catch(function(e) { console.log(e); });
        }

        btnZvuk.addEventListener('click', function(e) {
            e.stopPropagation(); 
            if (audio.paused) {
                jeZtlumeno = false;
                spustitTichouHudbu();
            } else {
                jeZtlumeno = true;
                audio.pause();
                svgZvuk.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"></path>';
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleAutoPosun() {
            var btn = document.getElementById('btn-posun');
            var indicator = document.getElementById('sbs-indicator');
            
            if (autoPosunInterval === null) {
                if (indicator) { indicator.classList.add('skryt'); }

                autoPosunInterval = setInterval(function() {
                    window.scrollBy(0, 1);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoPosunInterval);
                        autoPosunInterval = null;
                        btn.classList.remove('aktivni');
                    }
                }, 35);
                btn.classList.add('aktivni');
                if (audio.paused && !jeZtlumeno) { spustitTichouHudbu(); }
            } else {
                clearInterval(autoPosunInterval);
                autoPosunInterval = null;
                btn.classList.remove('aktivni');
                aktualizovatWeb();
            }
        }
    </script>
</body>
</html>
