<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratochvilná Poezie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixní vrstva s uměleckým pozadím kytice -->
    <div class="sbs-background"></div>

    <!-- Scrollovací vrstva s poezií -->
    <div class="story-container">

        <!-- 1. OBRAZOVKA: Úvodní filmový titul -->
        <section class="slide">
            <h1 class="nadpis-hlavni">Kratochvilná Poezie</h1>
            <div class="autor">Kratochvilný Jan</div>
            <div class="scroll-indicator">Skrolujte dolů ↓</div>
        </section>

        <!-- 2. OBRAZOVKA: Samotný hluboký verš -->
        <section class="slide">
            <p class="vers">„Svojí mysli, sobě král.“</p>
        </section>

    </div>

</body>
</html>
